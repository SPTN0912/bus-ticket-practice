<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Ticket System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🚌 Sri Lanka Bus Ticket System</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#search">Search Buses</a>
            <a href="#bookings">Bookings</a>
        </nav>
    </header>


    <main>

        <section id="home">
            <h2>Welcome to Bus Ticket System</h2>
            <p>Search and book your bus tickets easily.</p>
        </section>


        <section id="search">

            <h2>Search for a Bus</h2>

            <form id="searchForm">

                <label for="from">From:</label>
                <input type="text" id="from" required>

                <label for="to">To:</label>
                <input type="text" id="to" required>

                <label for="date">Date:</label>
                <input type="date" id="date" required>

                <button type="submit">Search</button>

            </form>

            <div id="busResults"></div>

        </section>


        <section id="bookings">

            <h2>My Bookings</h2>

            <div id="bookingList">
                <p>No bookings yet.</p>
            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 Bus Ticket System</p>
    </footer>


    <script src="js/script.js"></script>

</body>
</html>
